# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# The Admin SDK does NOT need a service-account key here: App Hosting runs on
# Cloud Run, whose runtime service account provides Application Default
# Credentials (see src/lib/firebase/admin.ts).

runConfig:
  # A single small instance is plenty for one cafe, and keeps the bill near zero.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ---------------------------------------------------------------------
  # Public Firebase web config. These are public identifiers (they ship in
  # the browser bundle), so they are plain values rather than secrets.
  # They must be available at BUILD time to be inlined by Next.js.
  # ---------------------------------------------------------------------
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB9zpxIRYTDDdOy9wtqg0_bY9zgfLkiZ1A
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: dumerso.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: dumerso
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:631228962202:web:28711836d90956c8619623"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: dumerso.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "631228962202"
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------
  # Who is allowed in. The bootstrap list is not sensitive; the invite code
  # is, so it lives in Cloud Secret Manager. Create it once with:
  #   firebase apphosting:secrets:set signup-invite-code
  #   firebase apphosting:secrets:grantaccess signup-invite-code --backend <backend-id>
  # ---------------------------------------------------------------------
  - variable: FIREBASE_BOOTSTRAP_ADMIN_EMAILS
    value: erayetsegaye@gmail.com
    availability:
      - RUNTIME

  - variable: SIGNUP_INVITE_CODE
    secret: signup-invite-code
    availability:
      - RUNTIME
